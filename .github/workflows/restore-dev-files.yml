name: restore-dev-files

on:
  push:
    branches: [DEV_BRANCH]
    paths:
      - ".github/workflows/restore-dev-files.yml"

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'ci: restore automations files')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV_BRANCH
          fetch-depth: 0

      - name: Restore exact files from last-good blob plus local patch
        run: |
          set -euo pipefail
          git checkout 07805e768654495aaaf7571057913844b264b693 -- src/components/automations/workflow-canvas.tsx
          python3 .github/workflows/restore-dev-files.py
          echo "canvas $(git hash-object src/components/automations/workflow-canvas.tsx)"
          echo "preview $(git hash-object src/lib/preview-mocks.ts)"
          test "$(git hash-object src/components/automations/workflow-canvas.tsx)" = "29adb55859e7fa1992a024f57215cfb0c95efcd1"
          test "$(git hash-object src/lib/preview-mocks.ts)" = "8a814f5149fb68f75dcf6aca5546c749ce22850b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/automations/workflow-canvas.tsx
          git commit -m "fix(automacoes): stages opcional no canvas legado"
          git add src/lib/preview-mocks.ts
          git commit -m "fix(preview): pipelines com stages e rotas de automacao"
          git rm .github/workflows/restore-dev-files.yml .github/workflows/restore-dev-files.py
          git commit -m "ci: cleanup restore workflow"
          git push origin HEAD:DEV_BRANCH
