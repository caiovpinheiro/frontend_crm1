<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Bwipo">
  <title>Bwipo</title>
  <defs>
    <radialGradient id="cyanGlow" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#0d1b3e" />
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#cyanGlow)" />

  <!-- Letra "B" em branco, geometria solida via retangulos + circulos -->
  <g fill="#ffffff">
    <rect x="330" y="270" width="120" height="484" rx="14" />
    <!-- hastes superior e inferior -->
    <rect x="330" y="270" width="300" height="104" rx="14" />
    <rect x="330" y="466" width="300" height="96" rx="14" />
    <rect x="330" y="650" width="300" height="104" rx="14" />
    <!-- curvas da direita (dois "bows") -->
    <circle cx="600" cy="374" r="104" />
    <circle cx="600" cy="650" r="104" />
  </g>
  <!-- recorta o interior dos bows com o fundo -->
  <g fill="#0d1b3e">
    <circle cx="600" cy="374" r="52" />
    <circle cx="600" cy="650" r="52" />
    <rect x="450" y="374" width="80" height="92" />
    <rect x="450" y="562" width="80" height="88" />
  </g>
</svg>
